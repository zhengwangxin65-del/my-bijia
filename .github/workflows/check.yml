name: 比价监控

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: 跑比价
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: python check.py
      - name: 提交结果
        run: |
          git config user.name "bijia-bot"
          git config user.email "bot@example.com"
          git add docs/history.json
          git commit -m "更新 $(date)" || echo "无变化"
          git push
