<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💰 我的比价监控</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
  .wrap{max-width:560px;margin:0 auto}
  h1{color:#fff;font-size:24px;text-align:center;margin-bottom:6px}
  .sub{color:rgba(255,255,255,.85);text-align:center;font-size:13px;margin-bottom:20px}
  .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .item{display:flex;align-items:center;justify-content:space-between;
        padding:14px;border-radius:14px;background:#f8f9ff;margin-bottom:10px;
        border-left:4px solid #667eea}
  .item.hit{border-left-color:#00b894;background:#eafff8}
  .name{font-weight:600;font-size:15px}
  .meta{font-size:12px;color:#888;margin-top:3px}
  .price{font-size:20px;font-weight:800;color:#e17055}
  .price.hit{color:#00b894}
  .tag{display:inline-block;font-size:11px;background:#eef;color:#667eea;
       border-radius:6px;padding:2px 7px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 我的比价监控</h1>
  <div class="sub" id="updated">加载中...</div>
  <div class="card" id="list"><div style="text-align:center;color:#888;padding:20px">加载中...</div></div>
</div>
<script>
fetch('history.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('updated').textContent = '最后更新：' + (data.updated || '暂无');
    const items = data.items || [];
    if (!items.length) {
      document.getElementById('list').innerHTML =
        '<div style="text-align:center;color:#888;padding:20px">还没数据，去 Actions 手动跑一次吧～</div>';
      return;
    }
    document.getElementById('list').innerHTML = items.map(it => {
      const last = it.last || {};
      const hit = it.target && last.low && last.low <= it.target;
      return `<div class="item ${hit?'hit':''}">
        <div>
          <div class="name">${it.name}</div>
          <div class="meta">${last.site||''} · ${last.date||''}
            ${it.target?`<span class="tag">心理价 ¥${it.target}</span>`:''}</div>
        </div>
        <div class="price ${hit?'hit':''}">${last.low?('¥'+last.low+(hit?' 🔥':'')):'—'}</div>
      </div>`;
    }).join('');
  })
  .catch(e => {
    document.getElementById('list').innerHTML =
      '<div style="text-align:center;color:#888;padding:20px">还没有 history.json，先跑一次 Actions～</div>';
  });
</script>
</body>
</html>
